name: regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          # Node 24: matches the locally verified toolchain; the runner
          # deprecates Node 20 (see CI annotation on run #1).
          node-version: "24"
      - name: Build the application from committed templates and data
        run: python tools/gen_dark.py
      - name: Standard regression suite (unit, integrity, parity)
        run: python tools/verify.py
